<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>赛斯Seth宇宙 · 概念手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%239c6f2e' d='m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">

  <header class="appbar static" id="appbar">
    <div class="brand brand-pill">
      <span class="hero-kicker">赛斯Seth宇宙 · 概念手册</span>
    </div>
    <button class="icon-btn font-btn" id="fontBtn" aria-label="调节字号">字</button>
    <button class="icon-btn" id="themeBtn" aria-label="切换深浅色"></button>
  </header>

  <main class="p-home">
    <!-- ========== 视图一：概念 ========== -->
    <section class="view" id="view-concepts">
      <div class="hero">
        <h1>理解赛斯哲学<br>探索<em>多元实相</em>的自己</h1>
        <p class="hero-sub">——「你创造你的实相」</p>
        <div class="hero-stats" id="heroStats"></div>
        <div class="hero-cta">
          <a class="btn btn-ghost btn-purple" href="theater/theater3d-release/index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11Z"/></svg>
            概念地图
          </a>
        </div>
      </div>

      <div class="searchwrap stuck">
        <div class="searchbox" id="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜概念、一句话解释…" autocomplete="off">
          <button class="search-clear" id="searchClear" aria-label="清空">✕</button>
        </div>
      </div>

      <div class="list" id="conceptList"></div>
    </section>

    <!-- ========== 视图二：档案（时间线 + 书海） ========== -->
    <section class="view" id="view-archive">
      <div class="section">
        <div class="section-head"><span class="tick"></span><h2>二十一年的录音档案</h2></div>
        <div class="timeline">
          <p class="tl-intro">每根柱子是当年被引原文的段数。点一年，看那一年哪些概念在发声。</p>
          <div id="timeline"></div>
          <div class="tl-detail" id="tlDetail" style="display:none"></div>
        </div>
        <div class="section-head"><span class="tick"></span><h2>书海</h2><span class="count" id="bookCount"></span></div>
        <p class="tl-intro">按书看概念——点一本书，读它被引用的全部段落。</p>
        <div class="book-grid" id="bookGrid"></div>
      </div>
    </section>

    <!-- ========== 视图三：日签（随机一段赛斯原文）· 站点首页 ========== -->
    <section class="view active" id="view-daily">
      <div class="section">
        <div class="section-head">
          <span class="tick"></span><h2>随手签</h2>
          <button class="icon-btn daily-refresh" id="dailyShuffle" aria-label="换一张" title="换一张"></button>
          <span class="count" id="dailyDate"></span>
        </div>
        <p class="tl-intro">「你创造你的实相」<a id="dailyConcept" href="#"></a></p>
        <div id="dailyCard"></div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="on" data-tab="daily">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      日签
    </button>
    <button data-tab="concepts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h13"/></svg>
      wiki
    </button>
    <button data-href="ai-seth.html" title="AI 赛斯 · 公告与安装">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.9-.9L3 21l1.9-4.4A8 8 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/></svg>
      AI 赛斯
    </button>
    <button data-href="theater/theater3d-release/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11Z"/></svg>
      地图
    </button>
  </nav>

  <button class="totop" id="totop" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.5 12 8l6.5 6.5"/></svg>
  </button>
</div>

<!-- 随机引文抽屉 -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">随机一段</div>
    <button class="icon-btn" id="sheetClose" aria-label="关闭" style="width:30px;height:30px;border-radius:10px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>  <div id="sheetBody"></div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="sheetShuffle">换一段</button>
    <button class="btn btn-primary" id="sheetOpen" style="display:none">打开所属词条</button>
  </div>
</div>

<!-- 分享卡片预览 -->
<div class="share-mask" id="shareMask"></div>
<div class="share-sheet" id="shareSheet">
  <div class="share-head">
    <div class="share-title">长按图片保存</div>
    <button class="icon-btn" id="shareClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="share-stage"><img id="sharePreview" alt="分享卡片"></div>
  <div class="share-actions">
    <button class="btn btn-primary" id="shareSave">保存图片</button>
  </div>
</div>

<script src="data/index.js"></script>
<script src="data/books.js"></script>
<script src="assets/app.js"></script>
<script>
Wiki.bindTotop();
/* 深链：子页（ai-seth.html 等）底栏跳 index.html#concepts / #daily / #archive 时落到对应视图；
   无 hash 维持默认日签。app.js 的 IIFE 在本脚本前已跑完，底栏点击绑定已就绪，click() 即走 switchView。
   hashchange 一并监听：同文档内改 hash（不重载）也要能切视图 */
(function () {
  function activateFromHash() {
    var t = (location.hash || "").replace("#", "");
    if (!t) return;
    /* 档案不在底栏（走首屏 data-goto 入口），所以两种入口都认 */
    var btn = document.querySelector('.tabbar button[data-tab="' + t + '"], [data-goto="' + t + '"]');
    if (btn) btn.click();
  }
  activateFromHash();
  window.addEventListener("hashchange", activateFromHash);
})();
</script>
</body>
</html>
