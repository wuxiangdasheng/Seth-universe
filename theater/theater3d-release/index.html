<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0e08">
<title>核心概念速览·赛斯丨星巢</title>
<style>:root{--gold: #d98e5f;--gold-soft: rgba(217, 142, 95, .55);--warm: #ffe9d2;--serif: "PingFang SC", "SimHei", "Heiti SC", sans-serif;--title: "PingFang SC", "SimHei", "Heiti SC", sans-serif;--sans: "PingFang SC", "SimHei", "Heiti SC", sans-serif;--dockPadX: 14px;--hudPadX: 8px}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}body{font-family:var(--sans);background:#1a0e08;color:var(--warm);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}#app{position:fixed;inset:0}#app canvas{display:block;touch-action:none}.hbtn{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left,0px));z-index:61;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--gold);text-decoration:none;cursor:pointer;transition:transform .15s,color .2s}.hbtn:active{transform:scale(.94)}.hbtn svg{width:22px;height:22px}.rail{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:50%;transform:translateY(calc(-50% - 48px));z-index:18;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:auto;max-height:80vh;overflow-y:auto;scrollbar-width:none}.dock{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 var(--dockPadX) calc(13px + env(safe-area-inset-bottom));pointer-events:none}.dock>*{pointer-events:auto}.dockcols{pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:0 20px;align-items:end;width:100%;padding:0 var(--hudPadX)}.dockcols>.conceptbar{grid-column:1}.dockcols>.hud{grid-column:2}.rail::-webkit-scrollbar{display:none}.rail button{flex:none;appearance:none;border:none;background:#fff8ef9e;color:#5a3a20d9;font-family:var(--serif);font-size:.55rem;letter-spacing:.04em;width:21px;height:21px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;transition:all .2s}.rail button.on{background:#e9b98a99;color:#3f2712}.rail button:active{transform:scale(.95)}.actTitle{padding:0 var(--hudPadX);pointer-events:none}.actTitle span{display:block;text-align:left;font-family:var(--title);font-size:18px;font-weight:900;letter-spacing:.12em;color:var(--actColor, var(--gold))}.hud{min-width:0}.hud .line{font-family:var(--serif);font-size:16px;line-height:1.65;color:#111;background:none;border-radius:0;padding:0;box-shadow:none;text-align:right}.conceptbar{display:flex;flex-wrap:wrap;justify-content:flex-start;align-content:flex-start;gap:6px;padding:8px;min-width:0;pointer-events:auto;background:var(--actColor, var(--gold));transition:background .45s}.conceptbar:empty{display:none}.conceptbar .chip{font-family:var(--serif);font-size:12px;letter-spacing:.05em;color:var(--actColor, var(--gold));background:#fff;border:none;box-shadow:none;border-radius:0;padding:3px 8px;cursor:pointer;white-space:nowrap;transition:transform .15s,opacity .2s}.conceptbar .chip:active{transform:scale(.96);opacity:.7}.conceptbar .chip.pending{background:#ffffff8c;border:1px dashed var(--actColor, var(--gold));cursor:default}.conceptbar .chip.pending:active{transform:none;opacity:1}.card{--cardGold: #e3a75c;--cardInk: #fff4e2;position:fixed;z-index:30;left:50%;bottom:0;transform:translate(-50%,110%);width:min(440px,calc(100vw - 24px));background:#40200a85;border:1px solid rgba(255,200,130,.3);border-radius:20px 20px 0 0;-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);padding:14px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px -16px #00000080;opacity:0;pointer-events:none;transition:opacity .3s,transform .32s cubic-bezier(.2,.8,.2,1)}.card.show{opacity:1;transform:translate(-50%);pointer-events:auto}.card .grab{width:38px;height:4px;border-radius:2px;background:#ffd09273;margin:2px auto 14px}.card .act{font-size:.6rem;letter-spacing:.28em;color:var(--cardGold)}.card h3{font-family:var(--title);font-size:1.5rem;font-weight:900;margin:8px 0 2px;letter-spacing:.04em;color:var(--cardInk)}.card .en{font-size:.7rem;color:#ffe4baa8;letter-spacing:.06em}.card .tag{margin:14px 0 0;padding:12px 14px;border-left:2px solid var(--cardGold);background:#ffb66024;border-radius:4px 12px 12px 4px;font-family:var(--serif);font-size:.84rem;line-height:1.95;color:#fff2deeb}.card .kids{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;font-family:var(--serif);color:#ffecce9e;letter-spacing:.02em}.card .kids .sub{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,208,146,.38);font-size:.76rem;line-height:1.5;color:#ffecceeb;text-decoration:none}.card .kids .sub i{font-style:normal;font-size:.64rem;letter-spacing:.02em;color:#ffe4ba8c}.card .kids .sub.pend{opacity:.45}.card .kids[hidden]{display:none}.card .go{appearance:none;border:none;cursor:pointer;margin-top:16px;width:100%;background:linear-gradient(135deg,#e0a353,#bb7a36);color:#fffaf0;font-weight:700;font-size:.84rem;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:filter .2s,transform .15s;font-family:var(--sans)}.card .go:active{transform:scale(.97)}.card .x{position:absolute;top:12px;right:12px;border:none;background:none;color:#ffe4beb8;cursor:pointer;font-size:.9rem;padding:4px 6px}.loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#6b3010,#100803 74%);transition:opacity .8s ease;gap:20px}.loader.hide{opacity:0;pointer-events:none}.halo{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,180,110,.15);border-top-color:#ffc382f2;animation:spin 1.1s linear infinite;box-shadow:0 0 40px #ffa05040,inset 0 0 30px #ffa05026}@keyframes spin{to{transform:rotate(360deg)}}.loader p{font-size:13px;letter-spacing:4px;color:#ffd6aab3}.loader p.err{color:#ff9a76;letter-spacing:1px;line-height:1.8;text-align:center;padding:0 32px}
</style>
</head>
<body>

<div id="app"></div>

<!-- 左上角：返回站点首页（本页在 mobile-wiki/theater/theater3d/，../../ 回站点根） -->
<a class="hbtn" id="homeBtn" href="../../index.html" aria-label="返回首页" title="返回首页">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
</a>


<!-- 页底：章节标题一行（左对齐）+ 左右两栏（左＝概念标签群，右＝章节旁白） -->
<div class="dock">
  <div class="actTitle" id="actTitle"></div>
  <div class="dockcols">
    <div class="conceptbar" id="conceptbar"></div>
    <div class="hud">
      <div class="line" id="narLine"></div>
    </div>
  </div>
</div>
<!-- 右侧竖排：章节序号导航 -->
<nav class="rail" id="rail"></nav>

<aside class="card" id="card">
  <div class="grab"></div>
  <button class="x" id="cardX">✕</button>
  <div class="act" id="cardAct">—</div>
  <h3 id="cardName">—</h3>
  <div class="en" id="cardEn">—</div>
  <p class="tag" id="cardTag"></p>
  <p class="kids" id="cardKids" hidden></p>
  <a class="go" id="cardGo" href="#">打开完整词条<span id="cardGoName"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:14px;height:14px"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
  </a>
</aside>


<!-- 加载遮罩：打开即进模型页，壹幕就绪前由它全屏挡住 -->
<div class="loader" id="loader">
  <div class="halo"></div>
  <p id="loadText">赛斯宇宙…</p>
</div>

<script src="data/index.js?v=mvhwjizn"></script>
<script src="data/structure.js?v=mvhwjizn"></script>
<script src="acts.min.js?v=mvhwjizn"></script>
<script>
  if (location.protocol === 'file:') {
    window.addEventListener('load', function () {
      var h = document.querySelector('.halo'); if (h) h.style.display = 'none';
      var t = document.getElementById('loadText');
      if (t) t.outerHTML = '<p class="err">请用本地服务器打开，不能直接双击（file://）<br>在该目录执行：python3 -m http.server 8088<br>再访问 http://127.0.0.1:8088/theater/theater3d/</p>';
    });
  }
</script>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js?v=mvhwjizn",
    "three/addons/": "./lib/addons/"
  }
}
</script>

<script type="module" src="app.min.js?v=mvhwjizn"></script>
</body>
</html>
